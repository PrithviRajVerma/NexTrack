spring:
  application:
    name: nextrack-backend

  profiles:
    default: local

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nextrack_dev}
    username: ${POSTGRES_USER:nextrack}
    password: ${POSTGRES_PASSWORD:nextrack_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NexTrackHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# NexTrack Custom Properties
nextrack:
  security:
    jwt-secret: ${NEXTRACK_JWT_SECRET:default_dev_jwt_secret_must_be_overridden_in_production_32bytes}
    access-token-expiration-seconds: 900 # 15 minutes
    refresh-token-expiration-seconds: 604800 # 7 days
    encryption-master-key: ${NEXTRACK_SECURITY_ENCRYPTION_MASTER_KEY:k2d8J+u5m5b2kL9N4yF3qR8sW1e4t7y0u3i6o9p2a5s=}
  integrations:
    github:
      webhook:
        max-body-bytes: 2097152 # 2 MB strict body limit
        secret: ${NEXTRACK_INTEGRATIONS_GITHUB_WEBHOOK_SECRET:mock_webhook_secret}
