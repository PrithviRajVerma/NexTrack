<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexTrack — Design System & Screens Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#090A0F] text-slate-100 font-sans flex flex-col h-screen overflow-hidden">
  
  <!-- Switcher Toolbar -->
  <header class="h-14 bg-[#0F111A] border-b border-[#1F2437] px-6 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-xs text-white shadow-sm shadow-indigo-500/30">NX</div>
      <div>
        <h1 class="text-xs font-bold text-white tracking-tight flex items-center gap-2">
          NexTrack Linear Dual-Theme
          <span class="text-[10px] font-medium px-1.5 py-0.2 rounded bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">LOCKED SYSTEM</span>
        </h1>
        <p class="text-[10px] text-slate-400">Toggle screens below to test live interactions and Light/Dark themes</p>
      </div>
    </div>

    <!-- Screen Selector Tabs -->
    <div class="flex items-center gap-1.5 bg-[#131622] p-1 rounded-lg border border-[#1F2437] text-xs">
      <button id="btnKanban" onclick="switchFrame('ui-linear-dark/kanban_board.html', this)" class="px-3 py-1.5 rounded-md font-semibold bg-indigo-600 text-white transition-all shadow-sm flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"/></svg>
        <span>★ Kanban Board (NEW)</span>
      </button>

      <button id="btnOverview" onclick="switchFrame('ui-linear-dark/index.html', this)" class="px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition-all flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Workspace Overview</span>
      </button>

      <div class="h-4 w-px bg-[#1F2437] mx-1"></div>

      <button id="btnJira" onclick="switchFrame('ui-enterprise-jira/index.html', this)" class="px-2.5 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition-all text-[11px]">
        Enterprise Jira Style
      </button>

      <button id="btnSaas" onclick="switchFrame('ui-modern-saas/index.html', this)" class="px-2.5 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition-all text-[11px]">
        Modern SaaS Style
      </button>
    </div>

    <!-- Direct standalone link -->
    <div class="flex items-center gap-3">
      <a id="directLink" href="ui-linear-dark/kanban_board.html" target="_blank" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 font-medium bg-[#131622] px-2.5 py-1.5 rounded border border-[#1F2437] transition-colors">
        <span>Open Standalone Tab</span>
        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
      </a>
    </div>
  </header>

  <!-- Live Iframe Preview Container -->
  <main class="flex-1 w-full h-full bg-black">
    <iframe id="previewFrame" src="ui-linear-dark/kanban_board.html" class="w-full h-full border-0"></iframe>
  </main>

  <script>
    function switchFrame(url, btn) {
      document.getElementById('previewFrame').src = url;
      document.getElementById('directLink').href = url;
      document.querySelectorAll('header button').forEach(b => {
        b.className = 'px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition-all flex items-center gap-1.5 text-xs';
      });
      btn.className = 'px-3 py-1.5 rounded-md font-semibold bg-indigo-600 text-white transition-all shadow-sm flex items-center gap-1.5 text-xs';
    }
  </script>
</body>
</html>
