<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexTrack — UI Screens Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0A0D14] text-slate-100 font-sans flex flex-col h-screen overflow-hidden">
  
  <!-- Showcase Header -->
  <header class="h-14 bg-[#111622] border-b border-[#20283E] px-6 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-xs text-white shadow-sm shadow-indigo-500/30">NX</div>
      <div>
        <h1 class="text-xs font-bold text-white tracking-tight flex items-center gap-2">
          NexTrack UI Suite
          <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">JIRA + LINEAR HYBRID</span>
        </h1>
        <p class="text-[10px] text-slate-400">Pure HTML/CSS · Both Light & Dark themes live</p>
      </div>
    </div>

    <!-- Screen Tabs (Compare Original vs Refined) -->
    <div class="flex items-center gap-1.5 bg-[#161D2E] p-1 rounded-lg border border-[#20283E] text-xs">
      <button id="btnRefined" onclick="switchFrame('nextrack_ui_refined.html', this)" class="px-3 py-1.5 rounded-md font-semibold bg-indigo-600 text-white transition-all shadow-sm flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Refined Kanban (Latest)</span>
      </button>

      <button id="btnOriginal" onclick="switchFrame('ui-screens/01_kanban_board.html', this)" class="px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition-all flex items-center gap-1.5">
        <span>Original Baseline (01)</span>
      </button>
    </div>

    <!-- Direct standalone link -->
    <div class="flex items-center gap-3">
      <a id="directLink" href="nextrack_ui_refined.html" target="_blank" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1.5 font-medium bg-[#161D2E] px-3 py-1.5 rounded-lg border border-[#20283E] transition-colors">
        <span>Open Standalone Tab</span>
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
      </a>
    </div>
  </header>

  <!-- Live Iframe Preview Container -->
  <main class="flex-1 w-full h-full bg-[#0A0D14]">
    <iframe id="previewFrame" src="nextrack_ui_refined.html" class="w-full h-full border-0"></iframe>
  </main>

  <script>
    function switchFrame(url, btn) {
      document.getElementById('previewFrame').src = url;
      document.getElementById('directLink').href = url;
      document.querySelectorAll('header button').forEach(b => {
        b.className = 'px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition-all flex items-center gap-1.5 text-xs';
      });
      btn.className = 'px-3 py-1.5 rounded-md font-semibold bg-indigo-600 text-white transition-all shadow-sm flex items-center gap-1.5 text-xs';
    }
  </script>
</body>
</html>
