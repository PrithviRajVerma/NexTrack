services:
  postgres:
    image: postgres:16-alpine
    container_name: nextrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextrack_dev}
      POSTGRES_USER: ${POSTGRES_USER:-nextrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextrack_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nextrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextrack} -d ${POSTGRES_DB:-nextrack_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nextrack-network

volumes:
  nextrack_pgdata:
    name: nextrack_pgdata

networks:
  nextrack-network:
    name: nextrack-network
